name: Refresh metrics table

# Weekly precompute of the whole-universe metrics table that powers fincalc-mcp's
# instant screen_funds. Runs the private build code (fincalc-mcp) on GitHub's clean
# IP — mfapi fetches are ~0.3s here vs ~6-10s locally behind corporate TLS — and
# publishes only the derived metrics data back to this public repo (served via CDN).

on:
  schedule:
    - cron: "0 2 * * 0"        # every Sunday 02:00 UTC
  workflow_dispatch:            # manual trigger (with an optional test limit)
    inputs:
      limit:
        description: "Cap funds (0 = all). Set a small number for a quick test run."
        required: false
        default: "0"

permissions:
  contents: write               # commit the refreshed tables back to this repo

# Shared with refresh-portfolios.yml: both publish the benchmark series now, so
# they must take turns rather than race to push the same files.
concurrency:
  group: fincalc-data-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180        # full universe ~1-1.5 hr; hard cap well under the 6h limit
    steps:
      - name: Checkout fincalc-data (this repo)
        uses: actions/checkout@v4

      - name: Checkout private build code (fincalc-mcp, read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: abhijain864/fincalc-mcp
          ssh-key: ${{ secrets.MCP_DEPLOY_KEY }}
          path: fincalc-mcp

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      # The AMFI scheme list is the universe every other table joins on: the
      # metrics build takes its funds from it, and the monthly portfolio join maps
      # pack names to codes through it. It was built once (8 Jul 2026) and never
      # again, so every fund launched since was invisible -- the packs had the
      # funds, the join had no code to give them. Rebuilt here, weekly, straight
      # into this checkout. A failure keeps the published copy rather than
      # failing the run: last week's list is stale, not wrong.
      - name: Refresh AMFI scheme list
        working-directory: fincalc-mcp
        run: |
          set -uo pipefail
          if uv run --with-editable . python scripts/refresh.py \
               --out "$GITHUB_WORKSPACE/schemes.min.json.gz"; then
            echo "scheme list refreshed"
          else
            echo "::warning::scheme list refresh failed or was refused; building on the published copy"
            git -C "$GITHUB_WORKSPACE" checkout -- schemes.min.json.gz
          fi

      # Benchmark index series, extended to today in THIS checkout, so the build
      # below measures alpha over the same window as the fund returns. They used
      # to refresh only in the monthly portfolio job, in a mode that fetched new
      # indices but never extended held ones: in October every NSE series still
      # ended 4 Sep and every BSE one 15 Sep, six weeks behind the NAVs.
      # Each refresh that fails keeps the published table -- a stale series is
      # an answer with a date on it; a missing one silently drops alphas.
      - name: Refresh benchmark index series (NSE published, BSE reconstructed)
        if: ${{ (github.event.inputs.limit || '0') == '0' }}
        working-directory: fincalc-mcp
        run: |
          set -uo pipefail
          if uv run --with-editable . python scripts/build_tri.py --update \
               --map "$GITHUB_WORKSPACE/benchmark_map.json" \
               --table "$GITHUB_WORKSPACE/tri.min.json.gz"; then
            echo "NSE TRI extended"
          else
            echo "::warning::NSE TRI refresh failed; building on the published table"
            git -C "$GITHUB_WORKSPACE" checkout -- tri.min.json.gz
          fi
          # Whole history per index in one request; carries forward any index
          # BSE did not serve this run rather than dropping it.
          if uv run --with-editable . python scripts/build_bse_indices.py \
               --tri-out "$GITHUB_WORKSPACE/bse_tri.min.json.gz"; then
            echo "BSE TRI rebuilt"
          else
            echo "::warning::BSE TRI refresh failed; building on the published table"
            git -C "$GITHUB_WORKSPACE" checkout -- bse_tri.min.json.gz
          fi
          python3 - <<'PY'
          import gzip, json, os
          from collections import Counter
          for f in ("tri.min.json.gz", "bse_tri.min.json.gz"):
              s = json.load(gzip.open(os.path.join(os.environ["GITHUB_WORKSPACE"], f)))["series"]
              ends = Counter(max(v) for v in s.values()).most_common(3)
              print(f"{f}: {len(s)} indices, most recent ends {ends}")
          PY

      - name: Build metrics table
        working-directory: fincalc-mcp
        # Read the benchmark tables from THIS repo's checkout, not the CDN. The
        # alpha/beta columns depend on three tables that live here, and jsDelivr
        # caches for up to 24h -- a build that fetched them over the CDN could
        # publish metrics computed against yesterday's benchmark map while the
        # commit that changed it sat in the same run. The checkout is by
        # definition the version being published alongside.
        env:
          FINCALC_BENCH_MAP_PATH: ${{ github.workspace }}/benchmark_series.min.json.gz
          FINCALC_TRI_PATH: ${{ github.workspace }}/tri.min.json.gz
          FINCALC_BSE_TRI_PATH: ${{ github.workspace }}/bse_tri.min.json.gz
          # The list refreshed one step up -- through the CDN this would be
          # jsDelivr's copy, up to a day old.
          FINCALC_SCHEMES_PATH: ${{ github.workspace }}/schemes.min.json.gz
        run: |
          set -euo pipefail
          LIMIT="${{ github.event.inputs.limit || '0' }}"
          if [ "$LIMIT" != "0" ]; then
            # A limited run writes a DEV file and is never published. It used to
            # write metrics.min.json.gz and the publish step copied it out
            # unconditionally -- and build_metrics skips its own publish guards
            # when --limit is set (by design: a limited run is a dev run), so a
            # 40-fund "TEST RUN" would have replaced the live 2,000-fund table
            # with the safety net deliberately disarmed. Test runs now prove the
            # build works without being able to break what is live.
            echo "TEST RUN: first $LIMIT funds (dev file, NOT published)"
            uv run --with-editable . python scripts/build_metrics.py \
              --limit "$LIMIT" --out src/fincalc_mcp/data/metrics.dev.json.gz
            gzip -dc src/fincalc_mcp/data/metrics.dev.json.gz \
              | python3 -c "import json,sys; d=json.load(sys.stdin); c=d['columns']; r=d['rows']; i=c.index('bench'); print(f'dev table: {len(r)} funds, {len(c)} columns, {sum(1 for x in r if x[i])} with a benchmark')"
          else
            echo "FULL RUN: whole universe"
            uv run --with-editable . python scripts/build_metrics.py
          fi

      - name: Publish metrics, scheme list and benchmark series to fincalc-data
        if: ${{ (github.event.inputs.limit || '0') == '0' }}
        run: |
          set -euo pipefail
          cp fincalc-mcp/src/fincalc_mcp/data/metrics.min.json.gz metrics.min.json.gz
          ls -la metrics.min.json.gz
          git config user.name "fincalc-ci"
          git config user.email "fincalc-ci@users.noreply.github.com"
          git add metrics.min.json.gz schemes.min.json.gz tri.min.json.gz bse_tri.min.json.gz
          if git diff --cached --quiet; then
            echo "No change in metrics, scheme list or benchmark series; nothing to commit."
          else
            git commit -m "chore: metrics refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            # Both refresh jobs commit to this repo and they publish DISJOINT
            # files, but a long build can still lose the race: portfolios checked
            # out at 15:58, built for 26 minutes, and by 16:24 metrics had already
            # pushed -- so the push was rejected and 26 minutes of good tables
            # were thrown away. Rebase onto whatever landed meanwhile and retry.
            for attempt in 1 2 3; do
              git push && break
              echo "  push rejected (attempt $attempt); rebasing onto origin/main"
              git pull --rebase origin main
            done
          fi

      # The tools read these files through jsDelivr's @main alias, which caches
      # the branch -> commit resolution for up to 12h. Without a purge, the 18 Oct
      # run pushed a fresh table and the CDN kept serving the 11 Oct one -- and a
      # reconnected MCP loaded the stale copy into memory for its whole life.
      # A purge or verify failure warns rather than fails: the commit is already
      # published, and the cache expires on its own.
      - name: Purge jsDelivr cache
        if: ${{ (github.event.inputs.limit || '0') == '0' }}
        run: |
          set -uo pipefail
          for f in metrics.min.json.gz schemes.min.json.gz tri.min.json.gz bse_tri.min.json.gz; do
            curl -fsS --retry 3 "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$f" >/dev/null \
              && echo "purged $f" || echo "::warning::jsDelivr purge failed for $f"
          done
          want=$(gzip -dc metrics.min.json.gz | python3 -c "import json,sys; print(json.load(sys.stdin)['generated'])")
          for i in $(seq 1 12); do
            got=$(curl -fsS "https://cdn.jsdelivr.net/gh/${{ github.repository }}@main/metrics.min.json.gz" \
                  | gzip -dc | python3 -c "import json,sys; print(json.load(sys.stdin)['generated'])" || true)
            [ "$got" = "$want" ] && { echo "CDN serves metrics generated $want"; exit 0; }
            sleep 10
          done
          echo "::warning::CDN still serves metrics generated '$got', expected '$want'"
